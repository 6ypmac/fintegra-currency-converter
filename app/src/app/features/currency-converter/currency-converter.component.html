<div class="converter">
  <mat-form-field appearance="outline">
    <mat-label>From</mat-label>
    <mat-select [formControl]="form.controls.from">
      <mat-option *ngFor="let c of currencies" [value]="c.code">
        {{ c.name }} ({{ c.code }})
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>To</mat-label>
    <mat-select [formControl]="form.controls.to">
      <mat-option *ngFor="let c of currencies" [value]="c.code">
        {{ c.name }} ({{ c.code }})
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Amount</mat-label>
    <input matInput [formControl]="form.controls.amount" inputmode="decimal" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Converted</mat-label>
    <input matInput [value]="result?.convertedAmount ?? ''" readonly />
    <mat-hint>
      <ng-container *ngIf="loading; else hintRate">Updating…</ng-container>
      <ng-template #hintRate>
        <ng-container *ngIf="result">
          Rate: 1 {{ result.from }} = {{ result.rate }} {{ result.to }}
        </ng-container>
      </ng-template>
    </mat-hint>
  </mat-form-field>

  <mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="24"></mat-progress-spinner>

  <div *ngIf="error" class="error">{{ error }}</div>
</div>
